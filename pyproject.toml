[project]
name = "hack-days"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tinasikharulidze", email = "tina.sikharulidze@bse.eu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "mcp>=2",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.uv]
# This is a set of scripts and apps, not a package to build or install,
# so uv should only manage the .venv and the dependencies.
package = false
